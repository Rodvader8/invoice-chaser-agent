name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: "Tests (scripted model: no API key, no spend)"
        run: npm test
      - name: Offline evaluation against the pre-registered criteria
        run: npm run eval
      - name: Deliberate breaks must make the evaluation fail
        run: npm run eval:break
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
